<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Marina & Fabio ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #7a1020, #120406);
    overflow: hidden;
    font-family: 'Georgia', serif;
    color: #f6eaea;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    z-index: 5;
    padding: 20px;
}

h1 {
    font-size: clamp(2.2em, 6vw, 3em);
    text-shadow: 0 0 35px rgba(255, 190, 190, 1);
    margin-bottom: 20px;
}

img {
    width: min(70vw, 260px);
    height: min(70vw, 260px);
    object-fit: cover;
    border-radius: 22px;
    box-shadow: 0 0 55px rgba(255, 215, 150, 0.9);
    margin-bottom: 35px;
}

/* BUTTON ROW */
.buttons {
    position: relative;
    width: 420px;
    height: 90px;
    margin: 0 auto;
}

/* BUTTONS */
button {
    padding: 15px 38px;
    font-size: 1.3em;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    position: absolute;
    white-space: nowrap;
}

/* JA */
#yes {
    background: linear-gradient(135deg, #c01735, #7a1020);
    color: #fff;
    left: 60px;
    top: 15px;
    box-shadow: 0 0 35px rgba(255, 120, 160, 1);
}

/* NEIN */
#no {
    background: linear-gradient(135deg, #333, #111);
    color: #fff;
    left: 240px;
    top: 15px;
}

/* MESSAGE */
.message {
    position: fixed;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 22px;
    border-radius: 16px;
    font-size: 1.1em;
    box-shadow: 0 0 30px rgba(255, 140, 170, 1);
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 10;
}
.message.show { opacity: 1; }

/* ✨✨✨ GLAM PARTICLES ✨✨✨ */
.sparkle, .gold, .glam {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
}

/* Gold Glitter */
.gold {
    width: 6px;
    height: 6px;
    background: gold;
    box-shadow: 0 0 18px gold;
    animation: fall 5s linear infinite;
}

/* White Sparkles */
.sparkle {
    width: 4px;
    height: 4px;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 14px white;
    animation: sparkle 3s linear infinite;
}

/* Glam Dots */
.glam {
    width: 8px;
    height: 8px;
    background: rgba(255, 210, 140, 0.8);
    box-shadow: 0 0 25px rgba(255,210,140,1);
    animation: float 6s ease-in-out infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
}

@keyframes sparkle {
    0% { transform: scale(0); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
}

@keyframes float {
    0% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-40px); opacity: 1; }
    100% { transform: translateY(0); opacity: 0.4; }
}
</style>
</head>

<body>

<div class="container">
    <h1>Hey Krasavica ✨</h1>
    <h1>Willst du mein Valentine sein? ❤️</h1>

    <img src="image.png" alt="Wir zwei">

    <div class="buttons">
        <button id="yes" onclick="yesClicked()">JA 💎</button>
        <button id="no">NEIN</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const area = document.querySelector(".buttons");
let dodgeCount = 0;

let posX = 240;
let posY = 15;

function showMessage(text) {
    const msg = document.createElement("div");
    msg.className = "message";
    msg.textContent = text;
    document.body.appendChild(msg);

    setTimeout(() => msg.classList.add("show"), 30);
    setTimeout(() => {
        msg.classList.remove("show");
        setTimeout(() => msg.remove(), 400);
    }, 2500);
}

function dodge() {
    dodgeCount++;

    posX += (Math.random() * 2 - 1) * 120;
    posY += (Math.random() * 2 - 1) * 30;

    const maxX = area.clientWidth - noBtn.offsetWidth;
    const maxY = area.clientHeight - noBtn.offsetHeight;

    posX = Math.max(0, Math.min(maxX, posX));
    posY = Math.max(0, Math.min(maxY, posY));

    noBtn.style.left = posX + "px";
    noBtn.style.top  = posY + "px";

    if (dodgeCount === 3) {
        showMessage("😈 Du kannst deinem Schicksal nicht ausweichen…");
    }
}

noBtn.addEventListener("mouseenter", dodge);
noBtn.addEventListener("touchstart", dodge);

function yesClicked() {
    document.body.innerHTML = `
        <div style="
            color:white;
            text-align:center;
            font-size:3em;
            text-shadow:0 0 45px gold;
        ">
            💖 JAAAA 💖<br><br>
            ✨ Nacho und ich, wir freuen uns! ✨
        </div>
    `;
}

/* ✨✨✨ MASSIV GLITTER ✨✨✨ */
setInterval(() => {
    const g = document.createElement("div");
    g.className = "gold";
    g.style.left = Math.random() * innerWidth + "px";
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 7000);
}, 70);

setInterval(() => {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random() * innerWidth + "px";
    s.style.top = Math.random() * innerHeight + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4000);
}, 50);

setInterval(() => {
    const c = document.createElement("div");
    c.className = "glam";
    c.style.left = Math.random() * innerWidth + "px";
    c.style.top = Math.random() * innerHeight + "px";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
}, 120);
</script>

</body>
</html>
